            }
            var i = 0; j = 0;
            for (var d = 0; d < 1024; d++) {
                i = (i + 1) & 255;
                j = (j + S[i]) & 255;
                var t = S[i]; S[i] = S[j]; S[j] = t;
            }
            var out = new Uint8Array(len);
            var prev = 0x5A;
            for (var x = 0; x < len; x++) {
                i = (i + 1) & 255;
                j = (j + S[i]) & 255;
                var t = S[i]; S[i] = S[j]; S[j] = t;
                var k = S[(S[i] + S[j]) & 255];
                var cur = raw.charCodeAt(x);
                out[x] = (cur ^ k ^ prev) & 255;
                prev = cur;
            }

            // Descodificacao UTF-8 garantida
            var html = '';
            if (typeof TextDecoder !== 'undefined') {
                html = new TextDecoder('utf-8').decode(out);
            } else {
                for (var x = 0; x < len; x++) html += String.fromCharCode(out[x]);
                html = decodeURIComponent(escape(html));
            }

            // Verificacao de integridade do documento interno (suporta maiusculas e minusculas)
            if (!html || html.toLowerCase().indexOf('<!doctype') === -1 || html.indexOf('__AUTH_SEC_VALID_CM2026_MASTER__') === -1) {
                __reportTamper('Falha crítica na autenticação do pacote interno da aplicação.');
                return;
            }

            // Substituicao limpa e completa do documento sem parser pendente
            setTimeout(function() {
                try {
                    document.open('text/html', 'replace');
                    document.write(html);
                    document.close();
                } catch(e) {
                    __reportTamper('Erro ao renderizar a aplicação: ' + e.message);
                }
            }, 0);

        } catch(err) {
            __reportTamper('Falha ao iniciar aplicação: ' + (err && err.message ? err.message : 'Acesso Recusado'));
        }
    })();
